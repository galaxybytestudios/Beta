<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BO1 Zombies - Offline Launcher</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
            color: #fff;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.85);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 10;
            border: 1px solid #444;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: opacity 0.5s ease;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="status">Iniciando sistema offline...</div>

    <!-- Iframe que carga el juego -->
    <iframe id="gameFrame" src="https://vel.gg/bsz"></iframe>

    <script>
        const statusDiv = document.getElementById('status');

        function updateStatus(text, duration = 4000) {
            statusDiv.innerText = text;
            statusDiv.style.opacity = '1';
            if (duration) {
                setTimeout(() => {
                    statusDiv.style.opacity = '0.3';
                }, duration);
            }
        }

        // Registrar Service Worker dinámicamente mediante Blob URL para que todo funcione en un solo archivo HTML
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'bo1-zombies-cache-v1';
                const TARGET_ORIGIN = 'https://vel.gg';

                self.addEventListener('install', (event) => {
                    self.skipWaiting();
                });

                self.addEventListener('activate', (event) => {
                    event.waitUntil(clients.claim());
                });

                self.addEventListener('fetch', (event) => {
                    const url = new URL(event.request.url);

                    // Interceptar solicitudes hacia el juego para aplicar estrategia Cache First con actualización en segundo plano (Stale-While-Revalidate)
                    if (url.origin === TARGET_ORIGIN || url.href.includes('vel.gg/bsz')) {
                        event.respondWith(
                            caches.open(CACHE_NAME).then(async (cache) => {
                                const cachedResponse = await cache.match(event.request);
                                
                                const fetchPromise = fetch(event.request).then((networkResponse) => {
                                    if (networkResponse && networkResponse.status === 200) {
                                        cache.put(event.request, networkResponse.clone());
                                    }
                                    return networkResponse;
                                }).catch(() => {
                                    // Si falla la red, ignoramos el error para seguir usando el caché local
                                });

                                // Si está en caché, lo devuelve al instante y actualiza en segundo plano; si no, espera a la red.
                                return cachedResponse || fetchPromise;
                            })
                        );
                    }
                });
            `;

            const blob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(blob);

            navigator.serviceWorker.register(swUrl)
                .then(() => {
                    console.log("Service Worker activo y controlando caché.");
                    if (navigator.onLine) {
                        updateStatus("Online: Juego sincronizado con caché local.");
                    } else {
                        updateStatus("Modo Offline: Ejecutando desde almacenamiento local.");
                    }
                })
                .catch((err) => {
                    console.error("Error al registrar el Service Worker:", err);
                    updateStatus("Aviso: El almacenamiento local avanzado no está disponible.");
                });
        } else {
            updateStatus("Tu navegador no soporta Service Workers.");
        }

        // Control de eventos de red en tiempo real
        window.addEventListener('online', () => {
            updateStatus("Conexión restablecida. Buscando actualizaciones...");
        });

        window.addEventListener('offline', () => {
            updateStatus("Sin conexión a internet. Jugando en modo offline.");
        });
    </script>

</body>
</html>
